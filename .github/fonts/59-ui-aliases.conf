<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- House CSS asks for Segoe UI, system-ui, Helvetica Neue, and Arial.
       On a stock Ubuntu image those names miss and DejaVu Sans is wider,
       so the 390px planner tables overflow. -->
  <match>
    <test name="family" compare="eq"><string>Segoe UI</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans</string></edit>
  </match>
  <match>
    <test name="family" compare="eq"><string>system-ui</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans</string></edit>
  </match>
  <match>
    <test name="family" compare="eq"><string>-apple-system</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans</string></edit>
  </match>
  <match>
    <test name="family" compare="eq"><string>Helvetica Neue</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Liberation Sans</string></edit>
  </match>
  <match>
    <test name="family" compare="eq"><string>Arial</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Arimo</string></edit>
  </match>
  <match>
    <test name="family" compare="eq"><string>Georgia</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Serif</string></edit>
  </match>
  <match>
    <test name="family" compare="eq"><string>Times New Roman</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Tinos</string></edit>
  </match>
</fontconfig>
